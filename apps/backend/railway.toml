# Railway config-as-code for the **API** service.
#
# Railway service settings this file assumes:
#   Root Directory   apps/backend   (the Dockerfile COPYs go.mod from the
#                                    context root, so the context must be this
#                                    directory, not the repo root)
#   Config file path (leave default — Railway finds this file under the root
#                     directory automatically)
#
# The worker runs from the same image and the same root directory, so it needs
# a config file of its own: set that service's "Config file path" to
# /apps/backend/railway.worker.toml.
#
# Values defined here override the Railway dashboard, so edit them here.
#
# Required variables (set in the Railway dashboard / shared variables — none of
# them have safe defaults):
#   DATABASE_URL           reference Postgres: ${{Postgres.DATABASE_URL}}
#   REDIS_URL              reference Redis:    ${{Redis.REDIS_URL}}
#   JWT_ACCESS_SECRET      >= 32 chars
#   JWT_REFRESH_SECRET     >= 32 chars
#   CONNECTOR_MASTER_KEY   base64 of exactly 32 bytes (openssl rand -base64 32)
#   PORT                   pin to 3000 so the frontend's BACKEND_URL
#                          (http://<api>.railway.internal:3000) stays stable
# Optional: APP_ENV, LOG_LEVEL, JWT_*_EXPIRES_IN, MCP_RATE_LIMIT_PER_MIN,
#   CONNECTOR_MASTER_KEY_PREVIOUS — see CLAUDE.md "Environment".

[build]
builder = "DOCKERFILE"
# dockerfilePath is deliberately unset: Railway auto-detects ./Dockerfile at
# the root directory, which avoids depending on whether the setting resolves
# against the repo root or the root directory.
watchPatterns = ["/apps/backend/**"]

[deploy]
startCommand = "/app/api"
# Runs in the built image before traffic shifts. The migrate binary ships in
# the same image (see the Dockerfile builder stage) and migrations are embedded,
# so no SQL files or goose CLI are needed. Deliberately only on this service —
# the worker must not race a second migration runner.
preDeployCommand = ["/app/migrate up"]
# Railway ignores the image's Docker HEALTHCHECK and probes this path over the
# assigned PORT instead.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
