info:
  contact: {}
  description: Multi-tenant B2B SaaS platform API.
  title: Sapanjai API
  version: 0.1.0
paths:
  /admin/2fa/confirm:
    post:
      consumes:
      - application/json
      parameters:
      - description: 6-digit code from the authenticator app
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_admin.TOTPConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_module_admin.TOTPConfirmResponse'
        "400":
          description: TOTP_NOT_ENROLLED
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "401":
          description: INVALID_TOTP_CODE / Unauthorized
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "403":
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "422":
          description: Validation failed
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirm TOTP enrollment (returns ten recovery codes once)
      tags:
      - admin
  /admin/2fa/enroll:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_module_admin.TOTPEnrollResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "403":
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Enroll a fresh TOTP secret (returns the otpauth:// URI once)
      tags:
      - admin
  /admin/2fa/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: TOTP code or an unused recovery code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_module_admin.TOTPVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_module_admin.SuccessResponse'
        "400":
          description: TOTP_NOT_ENROLLED
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "401":
          description: INVALID_TOTP_CODE / Unauthorized
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "403":
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "422":
          description: Validation failed
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "429":
          description: TOO_MANY_ATTEMPTS
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify a TOTP or recovery code (step-up, 12h)
      tags:
      - admin
  /admin/audit-logs:
    get:
      parameters:
      - description: Filter by organization ID
        in: query
        name: organizationId
        type: string
      - description: Filter by user ID
        in: query
        name: userId
        type: string
      - collectionFormat: multi
        description: Filter by action; repeatable, trailing '*' means prefix match
        in: query
        items:
          type: string
        name: action
        type: array
      - description: Only logs at or after this RFC3339 timestamp
        in: query
        name: from
        type: string
      - description: Only logs at or before this RFC3339 timestamp
        in: query
        name: to
        type: string
      - description: Max results (1-200, default 50)
        in: query
        name: limit
        type: integer
      - description: Pagination offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_module_admin.AuditLogsListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "403":
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "422":
          description: Validation failed
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Query audit logs (cross-org)
      tags:
      - admin
  /admin/connectors:
    get:
      parameters:
      - description: Filter by organization ID
        in: query
        name: organizationId
        type: string
      - description: Filter by connector type
        in: query
        name: type
        type: string
      - description: 'Filter by status: active, inactive, error'
        in: query
        name: status
        type: string
      - description: Match against connector name
        in: query
        name: search
        type: string
      - description: Max results (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Pagination offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_module_admin.ConnectorsListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "403":
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
        "422":
          description: Validation failed
          schema:
            $ref: '#/definitions/github_com_sapanjai_backend_internal_shared_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List connectors (cross-org, metadata only)
      tags:
      - admin
  /admin/mcp-keys:
    get:
      parameters:
      - description: Filter by organization ID
        in: query
        name: organizationId
        type: string
      - description: Filter by owner user ID
        in: query
        name: userId
        type: string
      - description: Match against key name or owner email
        in: query
        name: search
        type: string
      - description: Max results (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Pagination offset (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
