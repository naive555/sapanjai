# Railway config-as-code for the **web** service (Next.js dashboard).
#
# Railway service settings this file assumes:
#   Root Directory   apps/frontend
#
# Required variables:
#   BACKEND_URL   http://<api-service-name>.railway.internal:3000
#                 Server-side only — the browser never calls the backend
#                 cross-origin, it calls same-origin /api/* and
#                 app/api/[...path]/route.ts proxies at request time. Pin the
#                 API service's PORT to 3000 so this address stays stable.
#   GATEWAY_URL   the API service's *public* https URL. This one is handed out,
#                 not dialled: it goes into the connector page's MCP wiring
#                 snippet, so it must be reachable by an external MCP client.
#
# Both are read at runtime, not baked in at build time, so one image works
# against any environment. No build-time variables are needed.

[build]
builder = "DOCKERFILE"
watchPatterns = ["/apps/frontend/**"]

[deploy]
# startCommand is deliberately unset: the image's CMD (`node server.js`) is
# already correct, and node:alpine's docker-entrypoint.sh wrapper is easiest to
# leave alone. The standalone server reads PORT from the environment, so
# Railway's assigned port is picked up automatically.
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
