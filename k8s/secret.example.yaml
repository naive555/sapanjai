# Template — copy to secret.yaml, fill in real values, never commit it.
#
# DATABASE_URL is deliberately absent: it is assembled at pod startup from the
# postgres-credentials Secret (postgres/secret.example.yaml), which is also
# what configures the Postgres StatefulSet. Keeping a copy of the credentials
# here too would let the two drift apart silently.
apiVersion: v1
kind: Secret
metadata:
  name: sapanjai-secret
  namespace: sapanjai
type: Opaque
stringData:
  JWT_ACCESS_SECRET: change-me-min-32-characters-long-x
  JWT_REFRESH_SECRET: change-me-min-32-characters-long-x
  # base64 of exactly 32 bytes: openssl rand -base64 32. Unlike the JWT
  # secrets above (which only need enough length), a placeholder here fails
  # to decode, so an unedited template makes the API refuse to boot instead
  # of silently accepting a non-secret key.
  CONNECTOR_MASTER_KEY: change-me-base64-32-bytes
  REDIS_URL: redis://redis-service:6379
