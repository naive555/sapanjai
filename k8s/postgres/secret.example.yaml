# Template — copy to secret.yaml, fill in real values, never commit it.
#
# This is the ONLY place the database credentials are defined. It configures
# the Postgres StatefulSet itself, and the api/worker/migrate workloads build
# their DATABASE_URL from these same three values via $(VAR) expansion (see
# api/deployment.yaml) rather than keeping a second copy of them.
#
# Note: the password is interpolated into a URL, so avoid characters that
# would need percent-encoding there (@ : / ? #).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: sapanjai
type: Opaque
stringData:
  username: username
  password: password
  dbname: sapanjai
