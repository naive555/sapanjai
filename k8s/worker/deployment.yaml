apiVersion: apps/v1
kind: Deployment
metadata:
  name: junctera-worker
  namespace: junctera
spec:
  replicas: 1
  selector:
    matchLabels:
      app: junctera-worker
  template:
    metadata:
      labels:
        app: junctera-worker
    spec:
      containers:
        - name: junctera-worker
          image: junctera-api:latest
          imagePullPolicy: Never
          command: ["/app/worker"]
          ports:
            - containerPort: 3001
          # DATABASE_URL is assembled from the postgres-credentials Secret
          # rather than duplicated — see api/deployment.yaml for why, and for
          # the $(VAR) expansion rules that force this ordering.
          env:
            - name: WORKER_PORT
              value: "3001"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: dbname
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)?sslmode=disable
          envFrom:
            - configMapRef:
                name: junctera-config
            - secretRef:
                name: junctera-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
